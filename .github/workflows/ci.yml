name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.flags.outputs.rust }}
      python: ${{ steps.flags.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What the pull request touches (anything else than a pull request runs everything)
        id: flags
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          rust=true python=true
          if [[ -n "${BASE}" ]]; then
            files="$(git diff --name-only "${BASE}" HEAD)"
            grep -qE '^(engine/|\.github/)' <<<"${files}" || rust=false
            grep -qE '^(goethe/|tests/|pyproject|requirements|\.github/)' <<<"${files}" || python=false
          fi
          echo "rust=${rust}" >>"${GITHUB_OUTPUT}"
          echo "python=${python}" >>"${GITHUB_OUTPUT}"
          echo "rust=${rust} python=${python}"

  main-in-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit of main is in dev
        run: bash engine/tests/main_in_dev.sh origin/main origin/dev

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t .

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff check goethe tests
      - run: shellcheck -S warning install.sh engine/tests/accept.sh engine/tests/main_in_dev.sh nvfp4-kernels/*.sh nvfp4-kernels/bench/*.sh
      - uses: astral-sh/setup-uv@v6
      - name: Style lint (headers, function comments, no dashes or emojis, leak guard, pinned ruff with the repo rules)
        working-directory: engine
        run: python3 tests/lint_style.py
      - name: Shell syntax of installer and packaging scripts
        working-directory: engine
        run: for f in cdn/install.sh packaging/*.sh tests/gate.sh tests/*.sh; do bash -n "$f"; done

  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI tool listed as co-author in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no earlier commit to compare with; nothing to check"
            exit 0
          fi
          tools='claude|anthropic|cursor|copilot|codex|openai|chatgpt|gemini|devin|aider'
          found=""
          for c in $(git rev-list "${BASE}..${HEAD}"); do
            hit="$(git log -1 --format=%B "${c}" | grep -i -E "^co-authored-by:.*(${tools})|generated with .?(claude|cursor)" || true)"
            if [[ -n "${hit}" ]]; then
              found+="$(git rev-parse --short "${c}"): ${hit}"$'\n'
            fi
          done
          if [[ -n "${found}" ]]; then
            echo "These commits name an AI tool as co-author; remove the lines and push again:"
            echo "${found}"
            exit 1
          fi
          echo "no AI co-author lines in ${BASE:0:7}..${HEAD:0:7}"

  ninfer-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: patch applies to the pinned NInfer commit
        run: |
          . nvfp4-kernels/NINFER_PIN
          git clone --quiet --filter=blob:none --no-checkout "$NINFER_REPO" ninfer
          git -C ninfer checkout --quiet "$NINFER_REV"
          git -C ninfer apply --check "$GITHUB_WORKSPACE/nvfp4-kernels/patches/ninfer-dn-sched.patch"
          git -C ninfer apply --check "$GITHUB_WORKSPACE/nvfp4-kernels/patches/openai-tool-name-128.patch"

  engine-test:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          shared-key: engine-dev
      - run: cargo test --locked
      - run: cargo build --locked --features goethe/test-release-key
      - name: CPU gates (harness self-test, package signing and verification) on the dev build
        env:
          GOETHE_TEST_GPUS: ""
          GOETHE_NO_AUTOSTART: "1"
          GOETHE_GATE_PROFILE: debug
          GOETHE_GATE_CARGO_CHECKS: "0"
        run: |
          bash tests/gate.sh 0
          bash tests/gate.sh 6 --only stage6_integrity.py

  engine-clippy:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          shared-key: engine-clippy
      - run: cargo clippy --locked --all-targets -- -D warnings

  # The one check the main ruleset requires. It needs every other job (package-smoke runs only on main/nightly and is exempt),
  # fails when a job exists that it does not list (a new job cannot be forgotten: add it to `needs`), and accepts a skipped job
  # only when the `changes` flag that gates it is false; a failed `changes` job or any other skip fails it.
  gate:
    if: ${{ always() }}
    needs: [changes, main-in-dev, python, lint, attribution, ninfer-patch, engine-test, engine-clippy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every job passed (or was skipped for a false flag) and every job is listed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          listed=$(jq -r 'keys[]' <<<"$NEEDS" | sort)
          defined=$(awk '/^jobs:/{f=1;next} f&&/^  [a-z0-9-]+:/{gsub(/[ :]/,"");print}' .github/workflows/ci.yml | grep -vxE 'gate|package-smoke' | sort)
          [ "$listed" = "$defined" ] || { echo "gate.needs and the jobs of ci.yml differ:"; diff <(echo "$listed") <(echo "$defined"); exit 1; }
          bad=$(jq -r '
            .changes.outputs as $f
            | to_entries[]
            | select(.value.result != "success")
            | select((.value.result == "skipped" and ((.key == "python" and $f.python != "true") or (.key | IN("engine-test", "engine-clippy") and $f.rust != "true"))) | not)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          [ -z "$bad" ] || { echo "$bad"; exit 1; }

  package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - name: Patched SGLang source at the pinned commit
        run: |
          . engine/sglang/PIN
          git clone --quiet --filter=blob:none --no-checkout "$SGLANG_REPO" sglang-fork
          git -C sglang-fork checkout --quiet "$SGLANG_REV"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - name: Unsigned x86_64 package build (binaries, patched wheel, locks)
        env:
          SGLANG_FORK_SRC: ${{ github.workspace }}/sglang-fork
          GOETHE_ALLOW_UNSIGNED: "1"
        run: engine/packaging/build_cdn.sh --arch x86_64
      - name: The portable binaries run on a stock runner
        run: |
          engine/dist/cdn/bin/linux-x86_64/goethe --version
          engine/dist/cdn/bin/linux-x86_64/goethe --help >/dev/null
