name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.flags.outputs.rust }}
      e2e: ${{ steps.flags.outputs.e2e }}
      python: ${{ steps.flags.outputs.python }}
      patches: ${{ steps.flags.outputs.patches }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: What the pull request touches (push/schedule/dispatch runs everything)
        id: flags
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Path buckets: unit/clippy, heavy e2e, python package, out-of-tree kernel patches.
          rust=true e2e=true python=true patches=true
          if [[ -n "${BASE}" ]]; then
            rust=false e2e=false python=false patches=false
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              case "$f" in
                .github/*)
                  rust=true; e2e=true; python=true; patches=true ;;
                goethe/tests/*|goethe/pyenv/*|goethe/cdn/*|goethe/packaging/*)
                  rust=true; e2e=true ;;
                goethe/crates/*|goethe/Cargo.toml|goethe/Cargo.lock|goethe/rust-toolchain*)
                  rust=true ;;
                nvfp4-kernels/*)
                  patches=true ;;
                goethe/*)
                  rust=true ;;
                lab/*|tests/*|pyproject*|requirements*)
                  python=true ;;
              esac
            done <<<"$(git diff --name-only "${BASE}" HEAD)"
          fi
          {
            echo "rust=${rust}"
            echo "e2e=${e2e}"
            echo "python=${python}"
            echo "patches=${patches}"
          } >>"${GITHUB_OUTPUT}"
          echo "rust=${rust} e2e=${e2e} python=${python} patches=${patches}"

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t .

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uvx ruff@0.17.0 check lab tests
      - run: shellcheck -S warning install.sh goethe/tests/accept.sh nvfp4-kernels/*.sh nvfp4-kernels/bench/*.sh
      - name: Style lint (headers, function comments, no dashes or emojis, leak guard, pinned ruff with the repo rules)
        working-directory: goethe
        run: python3 tests/lint_style.py
      - name: Shell syntax of installer and packaging scripts
        working-directory: goethe
        run: |
          for f in cdn/install.sh packaging/*.sh tests/gate.sh tests/*.sh; do bash -n "$f"; done
          test -f cdn/install.ps1
          python3 -c "
          p=open('cdn/install.ps1','rb').read()
          assert p.startswith(b'#'), 'install.ps1 must start with a comment'
          assert b'WSL' in p and b'install.sh' in p, 'install.ps1 must hand off to install.sh'
          assert all(b<128 for b in p), 'install.ps1 must be ASCII-only for Windows PowerShell 5.1'
          assert len(p)>500
          "

  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: No AI tool listed as co-author in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no earlier commit to compare with; nothing to check"
            exit 0
          fi
          tools='claude|anthropic|cursor|copilot|codex|openai|chatgpt|gemini|devin|aider'
          found=""
          for c in $(git rev-list "${BASE}..${HEAD}"); do
            hit="$(git log -1 --format=%B "${c}" | grep -i -E "^co-authored-by:.*(${tools})|generated with .?(claude|cursor)" || true)"
            if [[ -n "${hit}" ]]; then
              found+="$(git rev-parse --short "${c}"): ${hit}"$'\n'
            fi
          done
          if [[ -n "${found}" ]]; then
            echo "These commits name an AI tool as co-author; remove the lines and push again:"
            echo "${found}"
            exit 1
          fi
          echo "no AI co-author lines in ${BASE:0:7}..${HEAD:0:7}"

  ninfer-patch:
    needs: changes
    if: ${{ needs.changes.outputs.patches == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: patch applies to the pinned NInfer commit
        run: |
          . nvfp4-kernels/NINFER_PIN
          git clone --quiet --filter=blob:none --no-checkout "$NINFER_REPO" ninfer
          git -C ninfer checkout --quiet "$NINFER_REV"
          git -C ninfer apply --check "$GITHUB_WORKSPACE/nvfp4-kernels/patches/ninfer-dn-sched.patch"
          git -C ninfer apply --check "$GITHUB_WORKSPACE/nvfp4-kernels/patches/openai-tool-name-128.patch"

  engine-test:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: goethe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: goethe
          shared-key: goethe-dev
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --features goethe/test-release-key
      - name: CPU gates (harness self-test, package signing and verification) on the dev build
        env:
          GOETHE_TEST_GPUS: ""
          GOETHE_NO_AUTOSTART: "1"
          GOETHE_GATE_PROFILE: debug
          GOETHE_GATE_CARGO_CHECKS: "0"
        run: |
          bash tests/gate.sh 0
          bash tests/gate.sh 6 --only stage6_integrity.py

  e2e-user:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: goethe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: goethe
          shared-key: goethe-dev
      - name: nginx, which goethe up starts
        run: sudo apt-get install -y -qq nginx >/dev/null
      - run: cargo build --locked --features goethe/test-release-key
      - name: The real binaries as a pristine user, no GPU (fake driver library, package host, platform, Hub mirror, packs and engines)
        run: python3 tests/e2e_cli.py FreshUser
      - name: The other user paths with no GPU (cards, offline, gated, Ctrl-C, fallback, bad index, update)
        run: python3 tests/e2e_cli.py Matrix

  # Does the end-to-end suite notice the bugs we shipped? Each patch in goethe/tests/mutants brings one back; the suite must go red.
  mutants:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: goethe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: goethe
          shared-key: goethe-dev
      - name: nginx, which goethe up starts
        run: sudo apt-get install -y -qq nginx >/dev/null
      - run: bash tests/mutants/run.sh

  # The one check the main ruleset requires. It needs every other job (package-smoke runs only on main/nightly and is exempt),
  # fails when a job exists that it does not list (a new job cannot be forgotten: add it to `needs`), and accepts a skipped job
  # only when the `changes` flag that gates it is false; a failed `changes` job or any other skip fails it.
  gate:
    if: ${{ always() }}
    needs: [changes, python, lint, attribution, ninfer-patch, engine-test, e2e-user]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every job passed (or was skipped for a false flag) and every job is listed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          listed=$(jq -r 'keys[]' <<<"$NEEDS" | sort)
          defined=$(awk '/^jobs:/{f=1;next} f&&/^  [a-z0-9-]+:/{gsub(/[ :]/,"");print}' .github/workflows/ci.yml | grep -vxE 'gate|package-smoke|mutants' | sort)
          [ "$listed" = "$defined" ] || { echo "gate.needs and the jobs of ci.yml differ:"; diff <(echo "$listed") <(echo "$defined"); exit 1; }
          bad=$(jq -r '
            .changes.outputs as $f
            | to_entries[]
            | select(.value.result != "success")
            | select((.value.result == "skipped" and (
                (.key == "python" and $f.python != "true")
                or (.key == "ninfer-patch" and $f.patches != "true")
                or (.key == "engine-test" and $f.rust != "true")
                or (.key == "e2e-user" and $f.e2e != "true")
              )) | not)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          [ -z "$bad" ] || { echo "$bad"; exit 1; }

  package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Patched SGLang source at the pinned commit
        run: |
          . goethe/sglang/PIN
          git clone --quiet --filter=blob:none --no-checkout "$SGLANG_REPO" sglang-fork
          git -C sglang-fork checkout --quiet "$SGLANG_REV"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - name: Unsigned x86_64 package build (binaries, patched wheel, locks)
        env:
          SGLANG_FORK_SRC: ${{ github.workspace }}/sglang-fork
          GOETHE_ALLOW_UNSIGNED: "1"
        run: goethe/packaging/build_cdn.sh --arch x86_64
      - name: The portable binaries run on a stock runner
        run: |
          goethe/dist/cdn/bin/linux-x86_64/goethe --version
          goethe/dist/cdn/bin/linux-x86_64/goethe --help >/dev/null
      - name: The portable binary refuses a foreign release key planted in the environment (a build trusting the test key would accept it)
        run: |
          d="$(mktemp -d)"
          mkdir "${d}/pkg"
          openssl ecparam -name prime256v1 -genkey -noout -out "${d}/foreign.key"
          openssl ec -in "${d}/foreign.key" -pubout -out "${d}/foreign_pub.pem" 2>/dev/null
          echo 9.9.9 >"${d}/pkg/VERSION"
          (cd "${d}/pkg" && sha256sum VERSION >SHA256SUMS)
          openssl dgst -sha256 -sign "${d}/foreign.key" -out "${d}/pkg/SHA256SUMS.sig" "${d}/pkg/SHA256SUMS"
          python3 -m http.server 18765 --bind 127.0.0.1 --directory "${d}/pkg" >/dev/null 2>&1 &
          server=$!
          sleep 1
          out="$(GOETHE_HOME="${d}/home" GOETHE_RELEASE_PUB="${d}/foreign_pub.pem" GOETHE_PKG_URL=http://127.0.0.1:18765 \
            goethe/dist/cdn/bin/linux-x86_64/goethe update --check 2>&1)" && rc=0 || rc=$?
          kill "${server}"
          echo "${out}"
          [[ "${rc}" -ne 0 && "${out}" == *"never takes its release key from the environment"* ]]
