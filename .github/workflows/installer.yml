# The curl | bash install in a Rocky 9 VM (SELinux, systemd, sudo's PATH): root and user installs, reinstall, upgrade, tampering, pinning, uninstall.
name: installer

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "goethe/cdn/install.sh"
      - "goethe/cdn/install.ps1"
      - "goethe/crates/core/src/setup.rs"
      - "goethe/crates/core/src/fix.rs"
      - "goethe/crates/core/src/fix_driver.sh"
      - "goethe/crates/core/src/update.rs"
      - "goethe/crates/core/src/service.rs"
      - "goethe/crates/core/src/nginx.rs"
      - "goethe/crates/core/src/release_key.rs"
      - "goethe/packaging/build_nginx_linux.sh"
      - "goethe/packaging/nginx_versions.sh"
      - "goethe/tests/vm/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/goethe-build
          key: portable-${{ hashFiles('goethe/Cargo.lock', 'goethe/rust-toolchain.toml') }}
          restore-keys: portable-
      - uses: actions/cache@v4
        id: nginx
        with:
          path: goethe/dist/cdn/bin/linux-x86_64/nginx
          key: nginx-linux-${{ hashFiles('goethe/packaging/nginx_versions.sh', 'goethe/packaging/build_nginx_linux.sh') }}
      - uses: actions/cache@v4
        with:
          path: goethe/tests/vm/.work/images
          key: vm-images-rocky9-v1
      - name: Portable goethe and goethed with the test release key
        run: GOETHE_CARGO_FEATURES=goethe/test-release-key bash goethe/packaging/build_bin.sh
      - name: goethe's nginx
        if: steps.nginx.outputs.cache-hit != 'true'
        run: bash goethe/packaging/build_nginx_linux.sh
      - name: Rocky 9 VM
        run: DISTROS=rocky bash goethe/tests/vm/run.sh
      - name: VM console on failure
        if: failure()
        run: tail -n 60 goethe/tests/vm/.work/console-rocky.log goethe/tests/vm/.work/result-rocky.log 2>/dev/null || true
