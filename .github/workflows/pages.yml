name: pages

# Serve an already published release at pkg.meshapplied.com again, from its GitHub Release files, without rebuilding.
# Use it when the release workflow published the GitHub Release but its pages job failed: Pages names a deployment
# after the commit, so once a deployment for a commit is cancelled, reruns of that release run are cancelled too.
# Run it from the Actions tab on main with the tag, for example v0.1.9.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to serve, for example v0.1.9
        required: true

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download the release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a tag like v0.1.9"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "goethe-cdn-${TAG#v}.tar.zst"
      - name: Unpack the package tree served at pkg.meshapplied.com
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir site && zstd -dc "goethe-cdn-${TAG#v}.tar.zst" | tar -C site --strip-components=1 -xf -
          test -f site/install.sh && test -f site/SHA256SUMS.sig && test -f site/v1/registry.json
          test "$(cat site/VERSION)" = "${TAG#v}" || { echo "::error::the package is $(cat site/VERSION), not ${TAG#v}"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
