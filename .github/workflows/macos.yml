# macOS (Apple Silicon): path-scoped unit/clippy vs package+e2e, same shape as ci.yml changes/gate. Pushes to dev and main run everything and alone save the caches pull requests restore.
name: macos

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.flags.outputs.unit }}
      e2e: ${{ steps.flags.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: What the pull request touches (push/dispatch runs everything)
        id: flags
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # unit: crates, toolchain, nextest config. e2e: crates, packaging, installer, mac e2e script, llama PIN.
          unit=true e2e=true
          if [[ -n "${BASE}" ]]; then
            unit=false e2e=false
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              case "$f" in
                .github/workflows/macos.yml)
                  unit=true; e2e=true ;;
                goethe/crates/*|goethe/Cargo.toml|goethe/Cargo.lock|goethe/rust-toolchain*)
                  unit=true; e2e=true ;;
                goethe/.config/*)
                  unit=true ;;
                goethe/packaging/*|goethe/tests/macos_e2e.sh|goethe/cdn/install.sh|goethe/llama-cpp/PIN)
                  e2e=true ;;
              esac
            done <<<"$(git diff --name-only "${BASE}" HEAD)"
          fi
          {
            echo "unit=${unit}"
            echo "e2e=${e2e}"
          } >>"${GITHUB_OUTPUT}"
          echo "unit=${unit} e2e=${e2e}"

  unit:
    needs: changes
    if: ${{ needs.changes.outputs.unit == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain
        working-directory: goethe
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: goethe
          shared-key: macos-unit
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest
      - name: Unit tests (nextest, .config/nextest.toml kills a test past 60 s)
        working-directory: goethe
        run: cargo nextest run --workspace --locked
      - name: Clippy
        working-directory: goethe
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Behavior is the same at any optimisation; the release workflow builds and e2e-tests the shipped profile before it signs.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain
        working-directory: goethe
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: goethe
          shared-key: macos-e2e
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: goethe/dist/cdn/bin/darwin-aarch64/nginx
          key: nginx-darwin-${{ hashFiles('goethe/packaging/nginx_versions.sh', 'goethe/packaging/build_macos.sh') }}
      - name: Build the macOS package, with the test release key the e2e needs (one build; the e2e reuses it)
        env:
          GOETHE_CARGO_FEATURES: goethe/test-release-key
        run: bash goethe/packaging/build_macos.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          path: goethe/dist/cdn/bin/darwin-aarch64/nginx
          key: nginx-darwin-${{ hashFiles('goethe/packaging/nginx_versions.sh', 'goethe/packaging/build_macos.sh') }}
      - name: End to end
        run: bash goethe/tests/macos_e2e.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: darwin-aarch64
          path: goethe/dist/cdn/bin/darwin-aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: snapshot-mac
          path: goethe/dist/snapshot-mac.json
          if-no-files-found: ignore
          retention-days: 7

  # The one check the dev and main rulesets require of this workflow: required jobs passed, or skipped because their path flag was false.
  macos-gate:
    if: ${{ always() }}
    needs: [changes, unit, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every job passed (or was skipped for a false flag) and every job is listed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          listed=$(jq -r 'keys[]' <<<"$NEEDS" | sort)
          defined=$(awk '/^jobs:/{f=1;next} f&&/^  [a-z0-9-]+:/{gsub(/[ :]/,"");print}' .github/workflows/macos.yml | grep -vxE 'macos-gate' | sort)
          [ "$listed" = "$defined" ] || { echo "gate.needs and the jobs of macos.yml differ:"; diff <(echo "$listed") <(echo "$defined"); exit 1; }
          bad=$(jq -r '
            .changes.outputs as $f
            | to_entries[]
            | select(.value.result != "success")
            | select((.value.result == "skipped" and (
                (.key == "unit" and $f.unit != "true")
                or (.key == "e2e" and $f.e2e != "true")
              )) | not)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
