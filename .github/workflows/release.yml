name: release

# Build, sign, verify and publish a Goethe release from main.
# Start it by pushing a tag vX.Y.Z on a commit of main (the version must match goethe/crates/goethe/Cargo.toml),
# or run it by hand from the Actions tab on main.
#
# Repository settings it needs:
#   environment "release"             required reviewers; GOETHE_SIGN_KEY lives here (not as a repo secret)
#   env secret GOETHE_SIGN_KEY        contents of release.key (P-256 PEM private key); merge job only
#   variable   GOETHE_RELEASE_PUB_FPR sha256 of the DER public key (printed by packaging/keygen.sh)
# The package is served by GitHub Pages at https://pkg.goethe.sh:
#   Settings > Pages > Source: GitHub Actions, Custom domain: pkg.goethe.sh, Enforce HTTPS
#   DNS: CNAME pkg.goethe.sh -> meshapplied.github.io
# Every release is also kept as GitHub Release files.
# If publish succeeded but pages failed, serve the release with the pages workflow (pages.yml) instead of a rerun.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      ci_green: ${{ steps.ci.outputs.green }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Release only from main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; releases are built from main only"
            exit 1
          fi
      - id: ci
        name: CI already passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&event=push&per_page=1" --jq '.total_count')" || {
            echo "::warning::could not ask for CI runs; the release runs CI itself"
            echo "green=0" >>"$GITHUB_OUTPUT"
            exit 0
          }
          if [[ "${runs}" == "1" ]]; then
            echo "push CI already passed on $GITHUB_SHA"
            echo "green=1" >>"$GITHUB_OUTPUT"
          else
            echo "no successful push CI run for $GITHUB_SHA; the release runs CI itself"
            echo "green=0" >>"$GITHUB_OUTPUT"
          fi
      - id: version
        name: Version from Cargo.toml (and the tag, when there is one)
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' goethe/crates/goethe/Cargo.toml | head -n1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match goethe/crates/goethe/Cargo.toml version $v"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

  ci:
    needs: guard
    if: ${{ needs.guard.outputs.ci_green != '1' }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: [guard, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Patched SGLang source at the pinned commit
        run: |
          . goethe/sglang/PIN
          git clone --quiet --filter=blob:none --no-checkout "$SGLANG_REPO" sglang-fork
          git -C sglang-fork checkout --quiet "$SGLANG_REV"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - name: "Release build unsigned (x86_64: wheel, pyenv, binaries); merge signs"
        env:
          SGLANG_FORK_SRC: ${{ github.workspace }}/sglang-fork
          GOETHE_RELEASE_PUB_FPR: ${{ vars.GOETHE_RELEASE_PUB_FPR }}
          GOETHE_ALLOW_UNSIGNED: "1"
        run: goethe/packaging/build_cdn.sh --release --arch x86_64
      - name: Verify what will ship (x86_64; signature comes from merge)
        run: |
          cd goethe/dist/cdn
          grep -q "release=1" BUILDINFO
          grep -q "fork_dirty=0" BUILDINFO
          test -f SHA256SUMS
          test ! -e SHA256SUMS.sig
          sha256sum -c SHA256SUMS
          awk "/-----BEGIN PUBLIC KEY-----/,/-----END PUBLIC KEY-----/" install.sh \
            | sed "s/^GOETHE_RELEASE_PUB_PEM='//; s/'\$//" >"$RUNNER_TEMP/embedded.pem"
          fpr="$(openssl pkey -pubin -in "$RUNNER_TEMP/embedded.pem" -outform DER | sha256sum | cut -d' ' -f1)"
          [[ "$fpr" == "${{ vars.GOETHE_RELEASE_PUB_FPR }}" ]]
          bash -n install.sh
          test -f install.ps1
          bin/linux-x86_64/goethe --version
          bin/linux-x86_64/goethe --help >/dev/null
          file bin/linux-x86_64/goethe | grep -q "x86-64"
      # Artifacts do not keep file modes, so the executables travel inside a tar.
      - name: Pack for the merge job
        run: tar -C goethe/dist -cf cdn-x86_64.tar cdn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cdn-x86_64
          path: cdn-x86_64.tar
          retention-days: 30

  build-aarch64:
    needs: [guard, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Portable aarch64 binaries and uv
        run: |
          mkdir -p goethe/dist/cdn/bin/linux-aarch64
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/0.13.1/uv-aarch64-unknown-linux-gnu.tar.gz"
          echo "9041c73c99fdc5892cf128140beb354eca9231d502068cc36e6cb53a8e59ad14  /tmp/uv.tar.gz" | sha256sum -c --quiet
          tar -xzf /tmp/uv.tar.gz -C goethe/dist/cdn/bin/linux-aarch64 --strip-components=1 "uv-aarch64-unknown-linux-gnu/uv"
          chmod +x goethe/dist/cdn/bin/linux-aarch64/uv
          GOETHE_ARCH=aarch64 goethe/packaging/build_bin.sh
          cp goethe/target-portable/aarch64-unknown-linux-gnu/release/goethe \
            goethe/target-portable/aarch64-unknown-linux-gnu/release/goethed goethe/dist/cdn/bin/linux-aarch64/
      - name: Verify the aarch64 binaries
        run: |
          cd goethe/dist/cdn/bin/linux-aarch64
          file goethe | grep -q "ARM aarch64"
          file goethed | grep -q "ARM aarch64"
          file uv | grep -q "ARM aarch64"
      - name: Pack for the merge job
        run: tar -C goethe/dist/cdn/bin -cf bin-aarch64.tar linux-aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-aarch64
          path: bin-aarch64.tar
          retention-days: 30

  nginx-aarch64:
    needs: [guard, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: goethe's own nginx for aarch64 Linux
        run: bash goethe/packaging/build_nginx_linux.sh
      - name: Pack for the merge job
        run: tar -C goethe/dist/cdn/bin -cf nginx-aarch64.tar linux-aarch64/nginx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nginx-aarch64
          path: nginx-aarch64.tar
          retention-days: 30

  build-macos:
    needs: [guard, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: goethe, goethed and nginx for Apple Silicon
        run: bash goethe/packaging/build_macos.sh
      - name: End to end on macOS
        run: bash goethe/tests/macos_e2e.sh
      - name: Pack for the merge job
        run: tar -C goethe/dist/cdn/bin -cf bin-darwin.tar darwin-aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-darwin
          path: bin-darwin.tar
          retention-days: 30

  merge:
    needs: [guard, build, build-aarch64, nginx-aarch64, build-macos]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Signing key is an environment secret: this job waits for required reviewers, then alone can sign.
    environment: release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cdn-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-aarch64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-darwin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nginx-aarch64
      - name: Unpack every platform
        run: |
          tar -xf cdn-x86_64.tar
          tar -C cdn/bin -xf bin-aarch64.tar
          tar -C cdn/bin -xf nginx-aarch64.tar
          tar -C cdn/bin -xf bin-darwin.tar
      - name: Combine both architectures into one package
        run: |
          for f in cdn/bin/linux-{aarch64,x86_64}/{goethe,goethed,uv,nginx} cdn/pyenv/bootstrap.sh; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
          done
          for b in goethe goethed uv nginx; do
            file "cdn/bin/linux-aarch64/$b" | grep -q "ARM aarch64" || { echo "aarch64 $b is not aarch64"; exit 1; }
          done
          for b in goethe goethed nginx; do
            file "cdn/bin/linux-x86_64/$b" | grep -q "x86-64" || { echo "x86_64 $b is not x86-64"; exit 1; }
          done
          for b in goethe goethed nginx; do
            test -x "cdn/bin/darwin-aarch64/$b" || { echo "darwin-aarch64 $b is missing"; exit 1; }
            file "cdn/bin/darwin-aarch64/$b" | grep -q "Mach-O 64-bit.*arm64" || { echo "darwin $b is not an arm64 Mach-O"; exit 1; }
          done
          cdn/bin/linux-x86_64/goethe --version
          sed -i 's/^arches=.*/arches=x86_64,aarch64/' cdn/BUILDINFO
          grep -q "arches=x86_64,aarch64" cdn/BUILDINFO
          grep -q "release=1" cdn/BUILDINFO
          rm -f cdn/SHA256SUMS cdn/SHA256SUMS.sig
          cd cdn
          find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.sig | sed 's|^\./||' | LC_ALL=C sort | while read -r f; do
            sha256sum "$f" | awk -v p="$f" '{print $1 "  " p}'
          done >SHA256SUMS
      - name: Sign the combined sums
        env:
          SIGN_KEY_PEM: ${{ secrets.GOETHE_SIGN_KEY }}
        run: |
          key="$RUNNER_TEMP/release.key"
          umask 077
          printf '%s\n' "$SIGN_KEY_PEM" >"$key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          openssl dgst -sha256 -sign "$key" -out cdn/SHA256SUMS.sig cdn/SHA256SUMS
          awk "/-----BEGIN PUBLIC KEY-----/,/-----END PUBLIC KEY-----/" cdn/install.sh \
            | sed "s/^GOETHE_RELEASE_PUB_PEM='//; s/'\$//" >"$RUNNER_TEMP/embedded.pem"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/embedded.pem" -signature cdn/SHA256SUMS.sig cdn/SHA256SUMS
          (cd cdn && sha256sum -c --quiet SHA256SUMS)
      - name: Archive
        run: tar -C "$GITHUB_WORKSPACE" -cf - cdn | zstd -19 -T0 -o "goethe-cdn-${{ needs.guard.outputs.version }}.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goethe-cdn
          path: |
            goethe-cdn-*.tar.zst
            cdn/install.sh
            cdn/install.ps1
            cdn/SHA256SUMS
            cdn/SHA256SUMS.sig
          retention-days: 30

  install-smoke:
    needs: merge
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: goethe-cdn
      - name: Installer accepts the signed package in a clean Ubuntu 22.04 container
        run: |
          mkdir pkg && zstd -dc goethe-cdn-*.tar.zst | tar -C pkg -xf -
          (cd pkg/cdn && python3 -m http.server 8999 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          docker run --rm --network host -e GOETHE_PKG_URL=http://127.0.0.1:8999 -e GOETHE_NO_AUTOSTART=1 ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq curl >/dev/null
            curl -fsSL http://127.0.0.1:8999/install.sh | bash
            goethe --version
            test -x /var/lib/goethe/nginx-root/usr/sbin/nginx
            test ! -e /var/lib/goethe/py-env
            goethe up --no-boot && goethe status
          '

  publish:
    needs: [guard, merge, install-smoke]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Approval already happened on merge (signing). Publish only uploads the signed artifact, and is the one job that may write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: goethe-cdn
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Goethe $VERSION" --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            goethe-cdn-*.tar.zst cdn/install.sh cdn/install.ps1 cdn/SHA256SUMS cdn/SHA256SUMS.sig

  image:
    needs: [guard, merge, publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      ref: ${{ steps.tags.outputs.image }}@${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: goethe-cdn
      - name: The signed package, checked before anything is built from it
        run: |
          mkdir pkg && zstd -dc goethe-cdn-*.tar.zst | tar -C pkg -xf -
          openssl dgst -sha256 -verify goethe/packaging/release_pub.pem -signature pkg/cdn/SHA256SUMS.sig pkg/cdn/SHA256SUMS
          (cd pkg/cdn && sha256sum -c --quiet SHA256SUMS)
          test "$(cat pkg/cdn/VERSION)" = "$VERSION"
      - name: Image name and tags (latest only for a release without a pre-release suffix)
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:${VERSION},${image}:${VERSION%.*}"
          [[ "$VERSION" == *-* ]] || tags="${tags},${image}:latest"
          echo "image=${image}" >>"$GITHUB_OUTPUT"
          echo "tags=${tags}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pkg/cdn
          file: goethe/packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Keyless signature of the pushed digest
        run: cosign sign --yes "${{ steps.tags.outputs.image }}@${{ steps.push.outputs.digest }}"

  image-smoke:
    needs: image
    if: ${{ !cancelled() && !failure() }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The published image on this runner's architecture, no GPU
        run: bash goethe/tests/image_smoke.sh "${{ needs.image.outputs.ref }}"

  pages:
    needs: [guard, merge, publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: goethe-cdn
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          sparse-checkout: goethe/packaging
      - name: The package tree served at pkg.goethe.sh, with the newest releases under v/
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash src/goethe/packaging/pages_site.sh goethe-cdn-*.tar.zst site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
