# goethe CLI binary.

[package]
name = "goethe"
version = "0.1.9"
edition = "2021"

[[bin]]
name = "goethe"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
goethe-core = { path = "../core" }
serde_json = "1"
