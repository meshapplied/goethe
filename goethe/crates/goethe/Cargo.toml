# goethe CLI binary.

[package]
name = "goethe"
version = "0.3.6"
edition = "2021"

[[bin]]
name = "goethe"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
goethe-core = { path = "../core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
test-release-key = ["goethe-core/test-release-key"]

[dev-dependencies]
tempfile = "3"
